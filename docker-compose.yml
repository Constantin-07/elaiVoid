version: '3.8'

services:
  void-editor:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
    # Sobrescrever o comando para usar 0.0.0.0
    command: >
      bash -c "
      cd /app &&
      echo '🚀 Iniciando Void Editor...' &&
      npm run download-builtin-extensions &&
      NODE=$$(node build/lib/node.js) &&
      if [ ! -e \"$$NODE\" ]; then
        echo '📥 Baixando Node.js...' &&
        npm run gulp node &&
        NODE=$$(node build/lib/node.js)
      fi &&
      echo '🌐 Iniciando servidor em 0.0.0.0:8080...' &&
      $$NODE ./scripts/code-web.js --host 0.0.0.0 --port 8080 --browserType none
      "
    restart: unless-stopped
